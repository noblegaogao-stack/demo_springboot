<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaid本地渲染与Excel导出</title>
    <!-- 引入Mermaid库，添加defer属性 -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js" defer></script>
    <!-- 引入SheetJS库 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- 引入html2canvas -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%);
            color: white;
            padding: 25px 40px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }
        
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
        
        .editor-panel, .preview-panel {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        
        .panel-title {
            font-size: 1.4rem;
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e6ed;
            display: flex;
            align-items: center;
        }
        
        .panel-title i {
            margin-right: 10px;
            color: #4b6cb7;
        }
        
        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            border: 2px solid #dce4ec;
            border-radius: 8px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s;
            background: #fcfdfe;
        }
        
        textarea:focus {
            outline: none;
            border-color: #4b6cb7;
            box-shadow: 0 0 0 3px rgba(75, 108, 183, 0.1);
        }
        
        #mermaidPreview {
            width: 100%;
            min-height: 300px;
            background: white;
            border: 2px solid #dce4ec;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: auto;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(75, 108, 183, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(75, 108, 183, 0.4);
        }
        
        .btn-secondary {
            background: #e0e6ed;
            color: #2c3e50;
        }
        
        .btn-secondary:hover {
            background: #d1d9e3;
        }
        
        .examples {
            margin-top: 25px;
            background: #eef2f7;
            border-radius: 8px;
            padding: 20px;
        }
        
        .examples h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        
        .example-btn {
            background: white;
            border: 1px solid #dce4ec;
            border-radius: 6px;
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        
        .example-btn:hover {
            background: #4b6cb7;
            color: white;
            border-color: #4b6cb7;
        }
        
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        
        footer {
            text-align: center;
            padding: 25px;
            color: #6c757d;
            border-top: 1px solid #e0e6ed;
            font-size: 0.9rem;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #4b6cb7;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Mermaid本地渲染与Excel导出</h1>
            <p class="subtitle">在浏览器中本地渲染Mermaid图表并导出为Excel文件</p>
        </header>
        
        <div class="content">
            <div class="editor-panel">
                <h2 class="panel-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 10px;">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                    </svg>
                    Mermaid代码编辑器
                </h2>
                
                <textarea id="mermaidCode" spellcheck="false">pie title 项目进度
    "已完成" : 75
    "进行中" : 20
    "待开始" : 5</textarea>
                
                <div class="examples">
                    <h3>图表示例：</h3>
                    <button class="example-btn" data-example="pie">饼图示例</button>
                    <button class="example-btn" data-example="bar">柱状图示例</button>
                    <button class="example-btn" data-example="flow">流程图示例</button>
                    <button class="example-btn" data-example="gantt">甘特图示例</button>
                </div>
                
                <div class="controls">
                    <button id="renderBtn" class="btn btn-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="23 7 16 12 23 17 23 7"></polygon>
                            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                        </svg>
                        渲染图表
                    </button>
                    <button id="exportBtn" class="btn btn-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        导出Excel
                    </button>
                    <button id="resetBtn" class="btn btn-secondary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2.5 2v6h6M21.5 22v-6h-6"></path>
                            <path d="M22 11.5A10 10 0 0 0 3.2 7.2M2 12.5a10 10 0 0 0 18.8 4.2"></path>
                        </svg>
                        重置
                    </button>
                </div>
                
                <div id="status" class="status"></div>
            </div>
            
            <div class="preview-panel">
                <h2 class="panel-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 10px;">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                        <line x1="8" y1="21" x2="16" y2="21"></line>
                        <line x1="12" y1="17" x2="12" y2="21"></line>
                    </svg>
                    图表预览
                </h2>
                
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>渲染图表中...</p>
                </div>
                
                <div id="mermaidPreview">
                    <p>输入Mermaid代码并点击"渲染图表"按钮</p>
                </div>
                
                <div class="instructions">
                    <h3>使用说明：</h3>
                    <ol>
                        <li>在左侧编辑器中输入或修改Mermaid代码</li>
                        <li>点击"渲染图表"按钮预览效果</li>
                        <li>满意后点击"导出Excel"按钮下载文件</li>
                        <li>使用Excel打开下载的文件查看图表</li>
                    </ol>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2023 Mermaid本地渲染与Excel导出工具 | 基于Spring Boot的解决方案</p>
        </footer>
    </div>

    <script>
        window.addEventListener('load', () => {
            console.log('脚本开始加载');
            // 初始化Mermaid
            mermaid.initialize({
                startOnLoad: false,
                theme: 'default',
                securityLevel: 'loose',
                fontFamily: 'Arial, sans-serif',
                flowchart: {
                    useMaxWidth: true,
                    htmlLabels: true
                }
            });
            console.log('Mermaid 初始化完成');

            // 获取DOM元素
            const mermaidCode = document.getElementById('mermaidCode');
            const renderBtn = document.getElementById('renderBtn');
            const exportBtn = document.getElementById('exportBtn');
            const resetBtn = document.getElementById('resetBtn');
            const previewDiv = document.getElementById('mermaidPreview');
            const statusDiv = document.getElementById('status');
            const loadingDiv = document.getElementById('loading');
            const exampleBtns = document.querySelectorAll('.example-btn');

            // 示例代码
            const examples = {
                pie: `pie title 项目进度
    "已完成" : 75
    "进行中" : 20
    "待开始" : 5`,

                bar: `barChart
    title 月度销售额
    xAxis 1月 2月 3月 4月 5月 6月
    series 销售额 : 120, 150, 180, 200, 170, 220`,

                flow: `flowchart TD
    A[开始] --> B{条件判断}
    B -->|是| C[执行操作1]
    B -->|否| D[执行操作2]
    C --> E[结束]
    D --> E`,

                gantt: `gantt
    title 项目计划
    dateFormat  YYYY-MM-DD
    section 设计
    需求分析      :a1, 2023-10-01, 7d
    原型设计      :after a1, 5d
    section 开发
    前端开发      :2023-10-15, 10d
    后端开发      :2023-10-15, 14d
    section 测试
    单元测试      :2023-10-30, 5d
    集成测试      :2023-11-05, 7d`
            };

            // 渲染图表
            renderBtn.addEventListener('click', async () => {
                console.log('点击渲染图表按钮');
                try {
                    // 显示加载状态
                    loadingDiv.style.display = 'block';
                    previewDiv.style.display = 'none';
                    statusDiv.style.display = 'none';

                    // 清除之前的渲染
                    previewDiv.innerHTML = '';

                    // 获取代码并渲染
                    const code = mermaidCode.value;
                    const { svg } = await mermaid.render('mermaid-svg', code);

                    // 显示渲染结果
                    previewDiv.innerHTML = svg;
                    loadingDiv.style.display = 'none';
                    previewDiv.style.display = 'block';

                    // 更新状态
                    showStatus('图表渲染成功！', 'success');
                } catch (error) {
                    console.error('渲染图表出错:', error);
                    loadingDiv.style.display = 'none';
                    previewDiv.style.display = 'block';
                    previewDiv.innerHTML = `<p style="color: #e74c3c; text-align: center;">渲染错误: ${error.message}</p>`;
                    showStatus(`渲染失败: ${error.message}`, 'error');
                }
            });

            // 导出Excel
            exportBtn.addEventListener('click', async () => {
                console.log('点击导出Excel按钮');
                if (previewDiv.innerHTML.includes('<svg') === false) {
                    showStatus('请先渲染图表', 'error');
                    return;
                }

                try {
                    // 显示加载状态
                    showStatus('正在生成Excel文件...', 'success');

                    // 使用html2canvas将SVG转换为图片
                    const canvas = await html2canvas(previewDiv, {
                        scale: 2,
                        backgroundColor: '#FFFFFF',
                        logging: false
                    });

                    // 将canvas转换为图片URL
                    const imageData = canvas.toDataURL('image/png');

                    // 创建Excel工作簿
                    const wb = XLSX.utils.book_new();
                    wb.SheetNames.push('Mermaid Chart');

                    // 创建工作表数据
                    const wsData = [
                        ['Mermaid图表导出'],
                        [''], // 空行
                        ['生成时间:', new Date().toLocaleString()],
                        ['图表代码:', mermaidCode.value],
                        [''] // 空行
                    ];

                    // 将图片添加到工作表
                    const ws = XLSX.utils.aoa_to_sheet(wsData);

                    // 注意：此处原代码存在问题，需正确处理图片添加逻辑
                    // 正确的添加图片到 Excel 的方式需要使用 XLSX 的相关 API
                    // 以下为示例，实际可能需要更复杂的处理
                    const img = {
                        name: 'chart.png',
                        data: imageData.replace(/^data:image\/png;base64,/, ''),
                        opts: {base64: true}
                    };
                    XLSX.utils.add_image(wb, img, 'Mermaid Chart!A6', {origin: {x: 0, y: 0}, width: 800, height: 600});

                    // 添加工作表
                    wb.Sheets['Mermaid Chart'] = ws;

                    // 导出Excel文件
                    XLSX.writeFile(wb, 'mermaid_chart_export.xlsx');

                    showStatus('Excel文件已成功生成并下载！', 'success');
                } catch (error) {
                    showStatus(`导出失败: ${error.message}`, 'error');
                }
            });

            // 重置功能
            resetBtn.addEventListener('click', () => {
                console.log('点击重置按钮');
                mermaidCode.value = examples.pie;
                previewDiv.innerHTML = '<p>输入Mermaid代码并点击"渲染图表"按钮</p>';
                statusDiv.style.display = 'none';
            });

            // 示例按钮
            exampleBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    console.log('点击示例按钮');
                    const exampleType = btn.getAttribute('data-example');
                    mermaidCode.value = examples[exampleType];
                    showStatus(`已加载${getExampleName(exampleType)}`, 'success');
                });
            });

            // 辅助函数：获取示例名称
            function getExampleName(type) {
                const names = {
                    pie: '饼图示例',
                    bar: '柱状图示例',
                    flow: '流程图示例',
                    gantt: '甘特图示例'
                };
                return names[type] || '示例';
            }

            // 显示状态消息
            function showStatus(message, type) {
                statusDiv.textContent = message;
                statusDiv.className = 'status ' + type;
                statusDiv.style.display = 'block';
            }

            // 页面加载时初始化
            window.addEventListener('load', () => {
                showStatus('请输入Mermaid代码并点击"渲染图表"按钮开始', 'success');
        exampleBtns.forEach(btn => {
                console.log('点击示例按钮');
                const exampleType = btn.getAttribute('data-example');
                mermaidCode.value = examples[exampleType];
                showStatus(`已加载${getExampleName(exampleType)}`, 'success');
            });
        });
        
        // 辅助函数：获取示例名称
        function getExampleName(type) {
            const names = {
                pie: '饼图示例',
                bar: '柱状图示例',
                flow: '流程图示例',
                gantt: '甘特图示例'
            };
            return names[type] || '示例';
        }
        
        // 显示状态消息
        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
            statusDiv.style.display = 'block';
        }

        });

    </script>
</body>
</html>
